<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد QR Code للفروع - تطبيق تسهيل</title>
    <!-- Sharp, professional font for clarity -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #1a237e; /* Deep Blue */
            --secondary-color: #ffca28; /* Amber Accent */
            --bg-color: #f4f6f8;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2.5rem;
        }
        
        .header p {
            color: #666;
            margin-top: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card Design (For Screen) */
        .branch-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 5px solid var(--primary-color);
        }

        .branch-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .branch-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .branch-id {
            font-family: monospace;
            background: #eee;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #555;
            display: inline-block;
            margin-bottom: 20px;
        }

        .qr-wrapper {
            background: white;
            padding: 15px;
            border: 2px dashed #ddd; /* Dashed border suggests a 'ticket' or 'cutout' */
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        .btn-print {
            background: var(--primary-color);
            color: white;
        }

        .btn-download {
            background: #e0e0e0;
            color: #333;
        }

        /* PRINT STYLING - This is where the magic happens for the printable ticket */
        #print-area {
            display: none; /* Hidden on screen */
        }

        @media print {
            /* Hide everything on the page */
            body > * {
                visibility: hidden;
            }

            /* Show ONLY the print area */
            #print-area, #print-area * {
                visibility: visible;
                display: block;
            }

            /* Position the print area to fill the page */
            #print-area {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                height: 100vh;
                background: white;
                z-index: 9999;
                
                /* Center the content vertically and horizontally on the paper */
                display: flex !important;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            /* Design the printable ticket */
            .printable-ticket {
                border: 8px double var(--primary-color);
                padding: 40px;
                width: 80%;
                max-width: 600px;
                border-radius: 30px;
            }
            
            .printable-header {
                font-size: 2rem;
                font-weight: 900;
                color: var(--primary-color);
                margin-bottom: 10px;
                border-bottom: 2px solid #eee;
                padding-bottom: 20px;
            }

            .printable-branch {
                font-size: 3rem;
                font-weight: 700;
                margin: 20px 0;
                color: #000;
            }

            .printable-qr {
                margin: 30px auto;
            }
            
            .printable-instruction {
                font-size: 1.5rem;
                color: #555;
                margin-top: 20px;
                background: #f9f9f9;
                padding: 15px;
                border-radius: 10px;
            }
            
            .printable-footer {
                margin-top: 30px;
                font-size: 0.9rem;
                color: #999;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📍 مولد QR Code للفروع</h1>
        <p>قم بطباعة هذه الأكواد وتعليقها في مداخل الفروع لتسجيل الحضور</p>
    </div>

    <div class="grid-container" id="cards-container">
        <!-- Cards will be generated here by JS -->
    </div>

    <!-- Hidden Print Area -->
    <div id="print-area">
        <!-- Content will be injected here when printing -->
    </div>

    <script>
        /** 
         * ⚙️ إعدادات الفروع ⚙️
         * قم بتعديل هذه القائمة لإضافة فروعك الخاصة
         * id: يجب أن يكون فريداً (سيستخدمه السيرفر لجلب الإحداثيات)
         */
        const branches = [
            { name: "الفرع البحري الرئيسي", id: "BR_000_MAIN_SEA" },
            { name: "الفرع الرئيسي - سموحة", id: "BR_001_SMOUHA" },
            { name: "فرع الإبراهيمية", id: "BR_002_IBRAHIMIA" },
            { name: "فرع عجمي ستار", id: "BR_003_AGAMI" },
            { name: "فرع المنشية", id: "BR_004_MANSHIA" },
            { name: "فرع القاهرة - مدينة نصر", id: "BR_005_CAIRO" }
        ];

        const container = document.getElementById('cards-container');
        const printArea = document.getElementById('print-area');

        // Function to Generate Cards
        branches.forEach((branch, index) => {
            const qrData = JSON.stringify({
                type: "attendance",
                branch: branch.name // 🔒 Using Name as requested
            });

            // Make Card HTML
            const card = document.createElement('div');
            card.className = 'branch-card';
            card.innerHTML = `
                <div class="branch-name">${branch.name}</div>
                <div class="branch-id">${branch.id}</div>
                
                <div class="qr-wrapper" id="qr-preview-${index}"></div>
                
                <div class="actions">
                    <button class="btn btn-print" onclick="printBranch(${index})">
                        <span>🖨️ طباعة للافتة</span>
                    </button>
                    <button class="btn btn-download" onclick="downloadQR(${index}, '${branch.name}')">
                        <span>⬇️ تحميل</span>
                    </button>
                </div>
            `;
            container.appendChild(card);

            // Generate Preview QR
            new QRCode(document.getElementById(`qr-preview-${index}`), {
                text: qrData,
                width: 160,
                height: 160,
                colorDark: "#1a237e",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        });

        // 🖨️ Print Function
        function printBranch(index) {
            const branch = branches[index];
            const qrData = JSON.stringify({
                type: "attendance",
                branch: branch.name
            });

            // Build the "Ticket" Design inside the hidden print-area
            printArea.innerHTML = `
                <div class="printable-ticket">
                    <div class="printable-header">Tashil App - تسجيل الحضور</div>
                    <div class="printable-branch">${branch.name}</div>
                    
                    <div id="qr-target-print" class="printable-qr"></div>
                    
                    <div class="printable-instruction">
                        يرجى مسح الرمز من التطبيق لتسجيل الحضور
                        <br>
                        📷 Scan to Check-In
                    </div>
                    
                    <div class="printable-footer">
                        Branch ID: ${branch.id} | Security Level: Geo-Fenced
                    </div>
                </div>
            `;

            // Generate High-Quality Large QR for Print
            // We need a slight delay to ensure the div is ready
            setTimeout(() => {
                const qrContainer = document.getElementById('qr-target-print');
                qrContainer.innerHTML = ''; // Clear previous
                new QRCode(qrContainer, {
                    text: qrData,
                    width: 400, // Large size for print clarity
                    height: 400,
                    colorDark: "#000000", // Pure black for best print contrast
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Wait for image generation then print
                setTimeout(() => {
                    window.print();
                }, 300);
            }, 50);
        }

        // ⬇️ Download Function
        function downloadQR(index, branchName) {
            const container = document.getElementById(`qr-preview-${index}`);
            // QRCode.js creates an <img> tag after generating
            const img = container.querySelector('img');
            
            if (img && img.src) {
                const link = document.createElement('a');
                link.download = `QR_${branchName.replace(/\s+/g, '_')}.png`;
                link.href = img.src;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                // Fallback for canvas if image not ready
                const canvas = container.querySelector('canvas');
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = `QR_${branchName.replace(/\s+/g, '_')}.png`;
                    link.href = canvas.toDataURL("image/png");
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }
    </script>
</body>
</html>
