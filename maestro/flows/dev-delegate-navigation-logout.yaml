appId: com.tashil.delegate.dev
---
# Maestro — delegate (**مندوب**) journey: login, home tab, profile, settings, logout.
# The delegate menu is a NavigationDrawer: each item's accessible text is
# "<label>\nعلامة التبويب n من 6", so taps use "<label>(\\n.*)?".

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: ../subflows/login-delegate.yaml

- extendedWaitUntil:
    visible:
      id: "tashil_main_menu_button"
    timeout: 120000
# TAS-350: the M3 NavigationBar adds "tab 1 of 4" to the label, so match
# the name plus an optional second line (same as the menu taps below).
- extendedWaitUntil:
    visible: "الرئيسية(\\n.*)?"
    timeout: 60000

- tapOn:
    id: "tashil_main_menu_button"
- tapOn: "الملف الشخصي(\\n.*)?"

- extendedWaitUntil:
    visible: "الملف الشخصي"
    timeout: 60000

- runFlow:
    file: ../subflows/pop-from-user-profile.yaml

- runFlow:
    file: ../subflows/wait-for-main-menu-button.yaml

- tapOn:
    id: "tashil_main_menu_button"
- tapOn: "الإعدادات(\\n.*)?"

- extendedWaitUntil:
    visible: "الإعدادات"
    timeout: 60000

# TAS-358: the field delegate's Settings has no logout row; the delegate
# logs out from the navigation menu. Go back to the shell first (TAS-387
# Mac gate: the flow looked for the row in Settings).
- tapOn: "رجوع|Back"
- runFlow:
    file: ../subflows/wait-for-main-menu-button.yaml

- runFlow:
    file: ../subflows/logout-via-menu.yaml
