appId: com.tashil.delegate.dev
---
# Maestro — staff (**موظف إداري**) journey: login, main nav, profile, settings, logout.
# No OS permission dialogs (Patrol owns those).

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: ../subflows/login-staff.yaml

- extendedWaitUntil:
    visible:
      id: "tashil_main_menu_button"
    timeout: 120000

- tapOn:
    id: "tashil_main_menu_button"
- tapOn: "الملف الشخصي"

- extendedWaitUntil:
    visible:
      id: "tashil_profile_phone_value"
    timeout: 60000
- assertVisible:
    id: "tashil_profile_phone_value"

- runFlow:
    file: ../subflows/pop-from-user-profile.yaml

- runFlow:
    file: ../subflows/wait-for-main-menu-button.yaml

- tapOn:
    id: "tashil_main_menu_button"
- tapOn: "الإعدادات"

- extendedWaitUntil:
    visible: "الإعدادات"
    timeout: 60000

- runFlow:
    file: ../subflows/logout-via-menu.yaml
