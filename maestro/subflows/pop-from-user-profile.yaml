appId: com.tashil.delegate.dev
---
# GoRouter /user-profile: Maestro `back` does not pop the AppBar leading control on iOS.
# Each fallback runs only while the profile is still on screen. Running them all
# after one already popped (tap 6%,9% + edge swipe on the home screen) opened the
# side drawer and hid tashil_main_menu_button (mac-gate a87285ae).
- runFlow:
    when:
      visible:
        id: "tashil_profile_phone_value"
    commands:
      - tapOn:
          text: "Back"
          optional: true
          retryTapIfNoChange: false

- runFlow:
    when:
      visible:
        id: "tashil_profile_phone_value"
    commands:
      - tapOn:
          text: "رجوع"
          optional: true
          retryTapIfNoChange: false

- runFlow:
    when:
      visible:
        id: "tashil_profile_phone_value"
    commands:
      - tapOn:
          point: "6%,9%"
          optional: true
          retryTapIfNoChange: false

- runFlow:
    when:
      visible:
        id: "tashil_profile_phone_value"
    commands:
      - swipe:
          start: "2%,50%"
          end: "45%,50%"

- extendedWaitUntil:
    notVisible:
      id: "tashil_profile_phone_value"
    timeout: 60000
