appId: com.tashil.delegate.dev
---
# iOS Save Password (English / Arabic). Use optional taps so a visible-but-stuck sheet cannot hang the journey.
- repeat:
    times: 16
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
          retryTapIfNoChange: false
      - tapOn:
          text: "ليس الآن"
          optional: true
          retryTapIfNoChange: false
      - tapOn:
          text: "Don't Save"
          optional: true
          retryTapIfNoChange: false
      - tapOn:
          text: "Never"
          optional: true
          retryTapIfNoChange: false
      - tapOn:
          text: "Never for This Website"
          optional: true
          retryTapIfNoChange: false
      - tapOn:
          text: "أبداً"
          optional: true
          retryTapIfNoChange: false
      - tapOn:
          text: "عدم الحفظ"
          optional: true
          retryTapIfNoChange: false
