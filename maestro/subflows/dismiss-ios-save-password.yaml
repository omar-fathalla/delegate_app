appId: com.tashil.delegate.dev
---
# Poll briefly for iOS Save Password sheet (English / Arabic simulator UI).
- repeat:
    times: 24
    commands:
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      - runFlow:
          when:
            visible: "ليس الآن"
          commands:
            - tapOn: "ليس الآن"

# Sheet occasionally re-prompts once after the first dismiss.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "ليس الآن"
    commands:
      - tapOn: "ليس الآن"
