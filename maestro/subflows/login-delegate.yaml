appId: com.tashil.delegate.dev
---
# Delegate login (**مندوب**): phone + fake national ID (dev doc only; not a password).

- runFlow:
    file: wait-for-login-screen.yaml

- tapOn: "مندوب"

- tapOn: "رقم الجوال"
- inputText: ${TASHIL_MAESTRO_DEV_DELEGATE_PHONE}

- tapOn: "الرقم القومي"
- inputText: ${TASHIL_MAESTRO_DEV_DELEGATE_NATIONAL_ID}

- pressKey: Enter

# Submit by id: the text "تسجيل الدخول" is also the form title, and the
# button can sit below the fold. Enter alone does not submit the
# delegate form. Skipped when Enter already logged in.
- runFlow:
    when:
      visible: "رقم الجوال"
    commands:
      # No hideKeyboard: Enter already closes it on iOS, and hideKeyboard
      # fails when there is no keyboard (mac-gate b252a762).
      - scrollUntilVisible:
          element:
            id: "tashil_login_submit_button"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "tashil_login_submit_button"

- runFlow:
    file: ./dismiss-ios-save-password.yaml

- extendedWaitUntil:
    notVisible: "تسجيل الدخول"
    timeout: 120000

- assertVisible:
    id: "tashil_main_menu_button"
