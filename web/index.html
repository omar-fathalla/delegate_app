  <!-- Google Maps JavaScript API for Flutter Web (defer: no render blocking; runs before DOMContentLoaded) -->
  <script>
    // Maps guard: resolves when google.maps is usable (script is deferred).
    window.mapsReady = new Promise(function (resolve) {
      var tries = 0;
      function check() {
        if (window.google && window.google.maps && window.google.maps.Map) { resolve(true); return; }
        if (++tries > 600) { resolve(false); return; } // ~30s cap
        setTimeout(check, 50);
      }
      window.__mapsScriptLoaded = check;
      check();
    });
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB4gLHxxHshJVbpOR5oq69lLotyfd6mwKs&libraries=drawing,marker" defer onload="window.__mapsScriptLoaded &amp;&amp; window.__mapsScriptLoaded()"></script>

  <!-- iOS meta tags & icons -->

  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFF9EF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #15130B;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
