name: Firestore indexes

# Read-only check: compare firestore.indexes.json with live prod indexes.
# The repo file is a UNION of live prod plus indexes needed by upcoming
# / dev queries. Fails if `firebase deploy --only firestore:indexes`
# would DELETE any prod composite index or field override. Entries the
# file would ADD are listed in the log but do not fail the job.
#
# Runs on the self-hosted runner tashil-box (GitHub-hosted runners are
# blocked by a billing issue), not tashil-delegate-mac. This is a
# short Python + HTTPS job, it needs a repo secret, and it must not take
# the Mac runner or share the Flutter CI concurrency group. It never
# deploys and never writes to prod.
#
# Required repository secret:
#   FIREBASE_INDEX_READER_SA
#     Service-account JSON for project practice-firebase-72df1 with
#     permission to list Firestore indexes (datastore.indexes.list is
#     enough; Cloud Datastore Viewer / Index Viewer also works).
#     Do not grant deploy, index create/delete, or datastore write.
#     The workflow does not create this secret; add it in the repo
#     Settings → Secrets and variables → Actions.
#
# Local run (from the repo root):
#   python3 scripts/check_firestore_indexes.py --self-test
#   python3 scripts/check_firestore_indexes.py --project practice-firebase-72df1
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
    paths:
      - firestore.indexes.json
      - scripts/check_firestore_indexes.py
      - .github/workflows/firestore-indexes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check indexes vs prod (read-only)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, tashil-box]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps (venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet google-auth requests
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Self-test
        run: python3 scripts/check_firestore_indexes.py --self-test
      - name: Compare file to prod (GET only)
        env:
          FIREBASE_INDEX_READER_SA: ${{ secrets.FIREBASE_INDEX_READER_SA }}
        run: python3 scripts/check_firestore_indexes.py --project practice-firebase-72df1
