name: Google Play

on:
  workflow_dispatch:
    inputs:
      upload_to_play_store:
        description: 'Upload directly to Google Play Internal Testing?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Delete old artifacts to free up storage quota
      - name: Delete old artifacts
        run: |
          # Delete artifacts older than 7 days using GitHub CLI
          gh api repos/${{ github.repository }}/actions/artifacts \
            --paginate -q '.artifacts[] | select(.name | startswith("app-release")) | "\(.id)"' \
            | xargs -I {} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{} || true
        env:
          GH_TOKEN: ${{ github.token }}

      # 0. تحديث رقم البناء (Build Number) في pubspec.yaml تلقائياً
      - name: Auto-increment Build Number
        run: |
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          CURRENT_BUILD=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)
          
          # Parse Major, Minor, Patch
          MAJOR=$(echo "$VERSION_NAME" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d'.' -f3)

          [ -z "$MAJOR" ] && MAJOR=1
          [ -z "$MINOR" ] && MINOR=0
          [ -z "$PATCH" ] && PATCH=0

          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
          else
            COMMITS=$(git log --oneline)
          fi
          
          # Determine version bump
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "(BREAKING CHANGE:|^[a-f0-9]+ [a-z]+\!:)"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ feat:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ fix:"; then
            BUMP="patch"
          fi
          
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          NEW_BUILD=$((CURRENT_BUILD + 1))
          NEW_VERSION="${NEW_VERSION_NAME}+${NEW_BUILD}"
          
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          
          echo "Updated version to $NEW_VERSION"
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m "chore: auto-increment version to $NEW_VERSION [skip ci]"
          git push

      # 1. إعداد جافا (الإصدار 21 كما هو في إعداداتك)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. جلب المكتبات
      - name: Install dependencies
        run: flutter pub get

      # 4. تشغيل الاختبارات (بشكل تسلسلي لتجنب تنافس الموارد)
      - name: Run tests
        run: flutter test --concurrency=1

      # 5. إعداد ملف التوقيع (Keystore) من Secrets
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks

      # 6. إنشاء ملف key.properties ديناميكياً
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 7. بناء نسخة الـ App Bundle الموقعة
      - name: Build AAB
        run: flutter build appbundle --release

      # 8. رفع الملف الناتج كـ Artifact (لتتمكن من تحميله)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      # 9. الرفع لـ Google Play (Internal Testing) بناءً على خيار التشغيل
      - name: Upload to Google Play
        if: ${{ github.event.inputs.upload_to_play_store == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.tashil.delegate
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Clean up old artifacts to free storage
      - name: Clean up old artifacts after upload
        if: always()
        run: |
          # Keep only the last 3 artifacts
          gh api repos/${{ github.repository }}/actions/artifacts \
            --paginate -q '.artifacts[] | select(.name | startswith("app-release")) | "\(.id) \(.created_at)"' \
            | sort -k2 -r | tail -n +4 | awk '{print $1}' \
            | xargs -I {} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{} || true
        env:
          GH_TOKEN: ${{ github.token }}

      # 10. إرسال "ما الجديد؟" تلقائياً للمندوبين عبر Firestore
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Publish Changelog to Firestore
        run: |
          # Get version from pubspec.yaml
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '\r\n ' )

          # Get commit messages since last release tag (or last 10 commits)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --no-merges --grep="^chore" --invert-grep | head -10)
          else
            COMMITS=$(git log --oneline --no-merges --grep="^chore" --invert-grep -10)
          fi

          # Build highlights array from commit messages
          HIGHLIGHTS=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Clean commit message: remove hash and conventional commit prefix
            MSG=$(echo "$line" | sed 's/^[a-f0-9]* //' | sed 's/^feat[:(][^)]*)*: *//' | sed 's/^fix[:(][^)]*)*: *//' | sed 's/^refactor[:(][^)]*)*: *//' | sed 's/^ *//')
            [ -z "$MSG" ] && continue
            # Escape double quotes for JSON
            MSG=$(echo "$MSG" | sed 's/"/\\"/g')
            HIGHLIGHTS="${HIGHLIGHTS}{\"stringValue\":\"${MSG}\"},"
          done <<< "$COMMITS"

          # Remove trailing comma or provide fallback if empty
          if [ -z "$HIGHLIGHTS" ]; then
            HIGHLIGHTS="{\"stringValue\":\"تحسينات عامة والأداء\"}"
          else
            HIGHLIGHTS=$(echo "$HIGHLIGHTS" | sed 's/,$//')
          fi

          ACCESS_TOKEN=$(gcloud auth print-access-token)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DOC_ID="release_${VERSION}_$(date +%s)"

          # Create Firestore document
          curl --fail-with-body -sS -X POST \
            "https://firestore.googleapis.com/v1/projects/practice-firebase-72df1/databases/(default)/documents/app_updates?documentId=${DOC_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"title\": {\"stringValue\": \"تحديث الإصدار ${VERSION}\"},
                \"titleEn\": {\"stringValue\": \"Version ${VERSION} Update\"},
                \"description\": {\"stringValue\": \"تم إصدار نسخة جديدة من التطبيق\"},
                \"descriptionEn\": {\"stringValue\": \"A new version of the app has been released\"},
                \"highlights\": {\"arrayValue\": {\"values\": [${HIGHLIGHTS}]}},
                \"highlightsEn\": {\"arrayValue\": {\"values\": [${HIGHLIGHTS}]}},
                \"version\": {\"stringValue\": \"${VERSION}\"},
                \"type\": {\"stringValue\": \"feature\"},
                \"priority\": {\"stringValue\": \"normal\"},
                \"createdAt\": {\"timestampValue\": \"${TIMESTAMP}\"},
                \"isActive\": {\"booleanValue\": true}
              }
            }"

          echo "Changelog published for version ${VERSION}"

          # Tag this release for future changelog diffs
          # Use -f to force update if tag already exists
          git tag -f "v${VERSION}"
          git push -f origin "v${VERSION}" || true
