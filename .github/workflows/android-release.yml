name: Build Signed AAB

on:
  push:
    branches: [ "main" ] # سيعمل التحديث عند الرفع لفرع main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. إعداد جافا (الإصدار 21 كما هو في إعداداتك)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. جلب المكتبات
      - name: Install dependencies
        run: flutter pub get

      # 4. إعداد ملف التوقيع (Keystore) من Secrets
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks

      # 5. إنشاء ملف key.properties ديناميكياً
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 6. بناء نسخة الـ App Bundle الموقعة
      - name: Build AAB
        run: flutter build appbundle --release

      # 7. رفع الملف الناتج كـ Artifact (لتتمكن من تحميله)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab

      # 8. الرفع التلقائي لـ Google Play (Internal Testing)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.tashil.delegate
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
