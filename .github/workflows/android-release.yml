name: Google Play

on:
  workflow_dispatch:
    inputs:
      upload_to_play_store:
        description: 'Upload directly to Google Play Internal Testing?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # needed only to prune old app-release artifacts

jobs:
  build:
    # Release builds run only from main; dispatching on any other branch skips the job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Free runner disk space (fixes "No space left on device" during bundleRelease).
      # Removes unused preinstalled toolchains only — the Android SDK is kept intact.
      - name: Free disk space
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/node_modules \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/go || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After cleanup:" && df -h /

      # Fail early unless pubspec's build number (+N) is above the last released one.
      # The last released versionCode is read from pubspec.yaml at the newest v* tag that does not contain HEAD
      # (release tags are created on the release SHA after a successful build per docs/release/RELEASE_RUNBOOK.md).
      - name: Check versionCode was bumped
        run: |
          CURRENT=$(grep -m1 "^version:" pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r ')
          CURRENT_CODE="${CURRENT##*+}"
          if ! [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml version '$CURRENT' has no numeric +N build number"; exit 1
          fi
          # Ignore tags that already contain HEAD (tagged release, or a re-run / Play upload retry).
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname --no-contains HEAD | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "::error::No v* release tag found; cannot verify versionCode. Tag the last release first."; exit 1
          fi
          LAST=$(git show "${LAST_TAG}:pubspec.yaml" | grep -m1 "^version:" | sed 's/^version:[[:space:]]*//' | tr -d '\r ')
          LAST_CODE="${LAST##*+}"
          if ! [[ "$LAST_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read build number from pubspec.yaml at ${LAST_TAG} ('$LAST')"; exit 1
          fi
          echo "Current: $CURRENT (code $CURRENT_CODE). Last release ${LAST_TAG}: $LAST (code $LAST_CODE)"
          if [ "$CURRENT_CODE" -le "$LAST_CODE" ]; then
            echo "::error::versionCode $CURRENT_CODE must be greater than $LAST_CODE (released in ${LAST_TAG}). Bump pubspec.yaml in a reviewed PR."; exit 1
          fi

      # 1. إعداد جافا (الإصدار 21 كما هو في إعداداتك)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. جلب المكتبات
      - name: Install dependencies
        run: flutter pub get

      # 4. تشغيل الاختبارات (بشكل تسلسلي لتجنب تنافس الموارد)
      - name: Run tests
        run: flutter test --concurrency=1

      # 5. إعداد ملف التوقيع (Keystore) من Secrets
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android/app/upload-keystore.jks

      # 6. إنشاء ملف key.properties ديناميكياً
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 7. بناء نسخة الـ App Bundle الموقعة
      - name: Build AAB
        run: flutter build appbundle --release

      # 8. رفع الملف الناتج كـ Artifact (لتتمكن من تحميله)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      # 9. الرفع لـ Google Play (Internal Testing) بناءً على خيار التشغيل
      - name: Upload to Google Play
        if: ${{ github.event.inputs.upload_to_play_store == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.tashil.delegate
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Clean up old artifacts to free storage
      - name: Clean up old artifacts after upload
        if: always()
        run: |
          # Keep only the last 3 artifacts
          gh api repos/${{ github.repository }}/actions/artifacts \
            --paginate -q '.artifacts[] | select(.name | startswith("app-release")) | "\(.id) \(.created_at)"' \
            | sort -k2 -r | tail -n +4 | awk '{print $1}' \
            | xargs -I {} gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/{} || true
        env:
          GH_TOKEN: ${{ github.token }}
