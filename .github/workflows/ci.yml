name: CI

# PR checks for Tashil App. No secrets, no deploys, read-only token.
# Permanent self-hosted runner: tashil-delegate-mac
# (labels: self-hosted, macOS, ARM64, delegate-app).
# Mohamed 2026-11-10 14:26 Cairo: stop using GitHub-hosted Actions for
# non-release CI; the Mac stays on 24/7. Do not change release workflows
# (android-release.yml, deploy-ios.yml) or the tashil-ci / tashil-mac runners.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Where jobs run (TAS-178): while the repo is private they run on the Mac
# self-hosted runners (delegate-app labels). Once the repo is public they run
# on GitHub-hosted runners (ubuntu-latest, iOS on macos-latest), which are free
# for public repos, and nothing from a fork PR ever reaches the Mac.

# One group per workflow per PR (TAS-172): a new push to a PR cancels that PR's
# older CI run, so superseded commits stop holding runner slots. The group name
# is different from PR User Test builds (user-test-…), so CI and User Test
# never cancel each other. Pushes to dev and manual runs are never cancelled.
# Heavy Mac builds still run one at a time: they only run on the slot-3
# runner (see build-web below).
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  analyze:
    name: Analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","delegate-app"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: ${{ !github.event.repository.private }}
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      # Fails only on errors; warnings/infos are reported but don't fail the job.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","delegate-app"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: ${{ !github.event.repository.private }}
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test
        # TAS-175: 4 test files at a time. At --concurrency=1 the suite took
        # 25-30 min on the shared Mac and often hit timeout-minutes: 30; at 4 the
        # same suite ran in under 2 min locally on this Mac.
        # TAS-162: golden/screenshot tests (tag `golden`, see dart_test.yaml)
        # run in the next step instead.
        run: flutter test --concurrency=4 --exclude-tags golden
      - name: Golden tests
        # TAS-195: goldens back in CI. Images are recorded on a Mac; the
        # comparator in test/flutter_test_config.dart accepts up to 0.5% pixel
        # diff for host antialiasing. Re-record locally:
        #   flutter test --tags golden --update-goldens
        run: flutter test --tags golden
      - name: Upload golden failures
        # Diff images (incl. *_testImage.png = this host's rendering) so a
        # failing golden can be inspected or re-recorded for Linux.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          retention-days: 7

  p0-scripts:
    name: P0 scripts (emulators)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","delegate-app"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Emulator port slots + override bind (TA-39, TAS-107)
        working-directory: .
        run: npm install --no-audit --no-fund && npm run test:scripts:emulator-slots && npm run test:scripts:emulator-ports
      - name: P0 scripts emulator test
        run: bash ../scripts/emulators_exec.sh --only auth,firestore --project demo-p0-scripts "node --test scripts/p0-scripts.emulator.test.js"

  build-web:
    name: Build web (release)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # One heavy delegate_app build at a time on the Mac (TAS-172): heavy builds
    # run only on the runner labelled slot-3, so they wait in GitHub's normal
    # job queue one behind the other. The old repo-wide concurrency group
    # (delegate-mac-heavy-build) kept only ONE pending job, so each new PR
    # cancelled the previous PR's waiting build.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","delegate-app","slot-3"]') || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: ${{ !github.event.repository.private }}
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build web
        run: flutter build web --release

  ios-dev-config-check:
    name: iOS dev config (static)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","delegate-app"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      # macOS system python3 is 3.9; Homebrew 3.12 is on this runner.
      # The self-test is also 3.9-safe (Optional[int], not int | None).
      - name: Prefer Homebrew Python
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Static checks (scripts, pbxproj, firebase_config.sh)
        run: bash scripts/ios_dev_config_check.sh
      - name: Maestro flow header guard
        run: bash scripts/maestro_check_flow_headers.sh
      - name: Patrol integration guard
        run: bash scripts/patrol_check_integration_targets.sh

  android-dev-config-check:
    name: Android dev config (static)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","delegate-app"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"
      - name: Static checks (dev flavor, google-services, docs)
        run: bash scripts/android_dev_config_check.sh && npm run test:scripts:android-dev-distribute-guard

  functions:
    name: Functions lint & test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","delegate-app"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test --if-present
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Staff accounts e2e (createStaffUser / claimInvite on emulators)
        working-directory: .
        run: npm install --no-audit --no-fund && npm run test:e2e:staff

  rules:
    name: Firestore rules & delegate login e2e (emulators)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","delegate-app"]') || 'ubuntu-latest' }}
    # TAS-107: 17+ suites; 20 min ran out on a busy Mac (#384, 20 Nov 2026).
    # TAS-182: measured 21 Nov 2026. ubuntu-latest: whole job ~6 min (Rules
    # tests ~5 min, ~12-15 s per suite). Self-hosted Mac under load (#406):
    # Rules tests 30m22s (~1.5-4 min per suite, every phase 5-8x slower:
    # CLI boot, rules load, test bodies; no download or install step stood
    # out), then both e2e suites ~2 min each, so 35 min cut off the last
    # one. Mac: 50 min (~36 min measured + headroom); hosted: 20 min.
    timeout-minutes: ${{ github.event.repository.private && 50 || 20 }}
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install root test deps
        run: npm install --no-audit --no-fund
      - name: Install functions deps
        run: npm --prefix functions ci
      - name: Rules tests
        run: npm run test:rules && npm run test:rules:interim && npm run test:rules:p0 && npm run test:rules:adv && npm run test:rules:docs && npm run test:rules:subs && npm run test:rules:qa-hold && npm run test:rules:profile && npm run test:rules:m31 && npm run test:rules:source && npm run test:rules:gaps && npm run test:rules:security && npm run test:rules:ut-nb && npm run test:rules:nationalid-scope && npm run test:rules:users-nationalid-lock && npm run test:rules:paymob-superseded && npm run test:rules:privileged-reupload
      - name: Subscriptions e2e (suspension job + Paymob hook on emulator)
        run: npm run test:e2e:subscriptions
      - name: Delegate login e2e (delegateLoginV2 -> custom token -> 1.14.3 query)
        run: npm run test:e2e:delegate
