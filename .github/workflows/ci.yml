name: CI

# PR checks for Tashil App. No secrets, no deploys, read-only token.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Fails only on errors; warnings/infos are reported but don't fail the job.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Test
        run: flutter test --concurrency=1

  build-web:
    name: Build web (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release

  functions:
    name: Functions lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test --if-present

  rules:
    name: Firestore rules & delegate login e2e (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Staff accounts e2e (createStaffUser / claimInvite on emulators)
        working-directory: .
        run: npm install --no-audit --no-fund && npm run test:e2e:staff
      - name: Install root test deps
        run: npm install --no-audit --no-fund
      - name: Install functions deps
        run: npm --prefix functions ci
      - name: Rules tests
        run: npm run test:rules && npm run test:rules:interim && npm run test:rules:p0 && npm run test:rules:adv
      - name: Delegate login e2e (delegateLoginV2 -> custom token -> 1.14.3 query)
        run: npm run test:e2e:delegate
