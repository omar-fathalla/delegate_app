name: CI

# PR checks for Tashil App. No secrets, no deploys, read-only token.
# Permanent self-hosted runner: tashil-delegate-mac
# (labels: self-hosted, macOS, ARM64, delegate-app).
# Mohamed 2026-11-10 14:26 Cairo: stop using GitHub-hosted Actions for
# non-release CI; the Mac stays on 24/7. Do not change release workflows
# (android-release.yml, deploy-ios.yml) or the tashil-ci / tashil-mac runners.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# One CI run per PR: a new push cancels the older run of the same PR, so the
# Mac never tests a commit that is already outdated. Pushes to dev are never
# cancelled (each merge gets its full run).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  # Picks the jobs this change needs (scripts/ci/ci_changes.sh, same mapping as
  # local_ci --changed). Docs-only PRs run just the static guards; push to dev
  # and manual runs always run everything.
  changes:
    name: Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            jobs="$(bash scripts/ci/ci_changes.sh "origin/${{ github.base_ref }}")"
          else
            jobs="$(bash scripts/ci/ci_changes.sh --all)"
          fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "CI jobs:$jobs"

  analyze:
    name: Analyze
    needs: changes
    if: contains(needs.changes.outputs.jobs, ' analyze ')
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      # Commands live in scripts/ci/jobs.sh (single source for CI, local_ci.sh, agents).
      - name: Analyze
        run: bash scripts/ci/run_job.sh analyze

  test:
    name: Test
    needs: changes
    if: contains(needs.changes.outputs.jobs, ' test ')
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test
        run: bash scripts/ci/run_job.sh test

  p0-scripts:
    name: P0 scripts (emulators)
    needs: changes
    if: contains(needs.changes.outputs.jobs, ' p0-scripts ') || contains(needs.changes.outputs.jobs, ' emulator-ports ')
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No GitHub cache: the self-hosted Mac keeps ~/.npm locally, and the
          # cache upload post-step stalled past the 15 min job timeout (2026-11-19).
      # JDK 21 already on the Mac (Android Studio JBR). setup-java re-downloaded
      # Temurin on fresh runners and hit the 15 min job timeout (2026-11-19).
      - name: Use local JDK 21
        run: |
          JH="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          "$JH/bin/java" -version
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"
      - name: Emulator port override bind (TA-39)
        run: bash scripts/ci/run_job.sh emulator-ports
      - name: P0 scripts emulator test
        run: bash scripts/ci/run_job.sh p0-scripts

  build-web:
    name: Build web (release)
    needs: changes
    if: contains(needs.changes.outputs.jobs, ' build-web ')
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 180
    # One heavy delegate_app build at a time on the Mac (replaces ~/mac-resources lock).
    concurrency:
      group: delegate-mac-heavy-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Build web
        run: bash scripts/ci/run_job.sh build-web

  ios-dev-config-check:
    name: iOS dev config (static)
    needs: changes
    if: contains(needs.changes.outputs.jobs, ' ios-guards ')
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      # macOS system python3 is 3.9; Homebrew 3.12 is on this runner.
      # The self-test is also 3.9-safe (Optional[int], not int | None).
      - name: Prefer Homebrew Python
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Static guards (iOS dev config, Maestro, Patrol, holds, CI tooling)
        run: bash scripts/ci/run_job.sh ios-guards

  android-dev-config-check:
    name: Android dev config (static)
    needs: changes
    if: contains(needs.changes.outputs.jobs, ' android-guards ')
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"
      - name: Static checks (dev flavor, google-services, docs)
        run: bash scripts/ci/run_job.sh android-guards

  functions:
    name: Functions lint & test
    needs: changes
    if: contains(needs.changes.outputs.jobs, ' functions ')
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No GitHub cache: the self-hosted Mac keeps ~/.npm locally, and the
          # cache upload post-step stalled past the 15 min job timeout (2026-11-19).
      # JDK 21 already on the Mac (Android Studio JBR). setup-java re-downloaded
      # Temurin on fresh runners and hit the 15 min job timeout (2026-11-19).
      - name: Use local JDK 21
        run: |
          JH="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          "$JH/bin/java" -version
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"
      - name: Functions lint, unit tests, staff e2e
        run: bash scripts/ci/run_job.sh functions

  rules:
    name: Firestore rules & delegate login e2e (emulators)
    needs: changes
    if: contains(needs.changes.outputs.jobs, ' rules ')
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # JDK 21 already on the Mac (Android Studio JBR). setup-java re-downloaded
      # Temurin on fresh runners and hit the 15 min job timeout (2026-11-19).
      - name: Use local JDK 21
        run: |
          JH="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          "$JH/bin/java" -version
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"
      - name: Rules + emulator e2e (every test:rules* in package.json)
        run: bash scripts/ci/run_job.sh rules
