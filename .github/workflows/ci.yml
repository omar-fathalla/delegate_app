name: CI

# PR checks for Tashil App. No secrets, no deploys, read-only token.
# Permanent self-hosted runner: tashil-delegate-mac
# (labels: self-hosted, macOS, ARM64, delegate-app).
# Mohamed 2026-11-10 14:26 Cairo: stop using GitHub-hosted Actions for
# non-release CI; the Mac stays on 24/7. Do not change release workflows
# (android-release.yml, deploy-ios.yml) or the tashil-ci / tashil-mac runners.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Shared with PR User Test builds so both workflows take the single
# tashil-delegate-mac runner one at a time instead of interleaving jobs.
# cancel-in-progress is false so CI and User Test do not cancel each other.
concurrency:
  group: tashil-delegate-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  analyze:
    name: Analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Install dependencies
        run: flutter pub get
      # Fails only on errors; warnings/infos are reported but don't fail the job.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Test
        run: flutter test --concurrency=1

  p0-scripts:
    name: P0 scripts (emulators)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: P0 scripts emulator test
        run: npx --yes firebase-tools@14.15.1 emulators:exec --only auth,firestore --project demo-p0-scripts "node --test scripts/p0-scripts.emulator.test.js"

  build-web:
    name: Build web (release)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release

  ios-dev-config-check:
    name: iOS dev config (static)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      # macOS system python3 is 3.9; Homebrew 3.12 is on this runner.
      # The self-test is also 3.9-safe (Optional[int], not int | None).
      - name: Prefer Homebrew Python
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Static checks (scripts, pbxproj, firebase_config.sh)
        run: bash scripts/ios_dev_config_check.sh
      - name: Maestro flow header guard
        run: bash scripts/maestro_check_flow_headers.sh
      - name: Patrol integration guard
        run: bash scripts/patrol_check_integration_targets.sh

  functions:
    name: Functions lint & test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test --if-present
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Staff accounts e2e (createStaffUser / claimInvite on emulators)
        working-directory: .
        run: npm install --no-audit --no-fund && npm run test:e2e:staff

  rules:
    name: Firestore rules & delegate login e2e (emulators)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install root test deps
        run: npm install --no-audit --no-fund
      - name: Install functions deps
        run: npm --prefix functions ci
      - name: Rules tests
        run: npm run test:rules && npm run test:rules:interim && npm run test:rules:p0 && npm run test:rules:adv && npm run test:rules:docs && npm run test:rules:subs && npm run test:rules:qa-hold && npm run test:rules:profile && npm run test:rules:m31 && npm run test:rules:source
      - name: Subscriptions e2e (suspension job + Paymob hook on emulator)
        run: npm run test:e2e:subscriptions
      - name: Delegate login e2e (delegateLoginV2 -> custom token -> 1.14.3 query)
        run: npm run test:e2e:delegate
