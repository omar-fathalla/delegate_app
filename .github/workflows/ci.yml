name: CI

# PR checks for Tashil App. No secrets, no deploys, read-only token.
# Permanent self-hosted runner: tashil-delegate-mac
# (labels: self-hosted, macOS, ARM64, delegate-app).
# Mohamed 2026-11-10 14:26 Cairo: stop using GitHub-hosted Actions for
# non-release CI; the Mac stays on 24/7. Do not change release workflows
# (android-release.yml, deploy-ios.yml) or the tashil-ci / tashil-mac runners.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Shared with PR User Test builds so both workflows take the single
# tashil-delegate-mac runner one at a time instead of interleaving jobs.
# cancel-in-progress is false so CI and User Test do not cancel each other.
concurrency:
  group: tashil-delegate-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  analyze:
    name: Analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      # Commands live in scripts/ci/jobs.sh (single source for CI, local_ci.sh, agents).
      - name: Analyze
        run: bash scripts/ci/run_job.sh analyze

  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test
        run: bash scripts/ci/run_job.sh test

  p0-scripts:
    name: P0 scripts (emulators)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Emulator port override bind (TA-39)
        run: bash scripts/ci/run_job.sh emulator-ports
      - name: P0 scripts emulator test
        run: bash scripts/ci/run_job.sh p0-scripts

  build-web:
    name: Build web (release)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 180
    # One heavy delegate_app build at a time on the Mac (replaces ~/mac-resources lock).
    concurrency:
      group: delegate-mac-heavy-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK in the
          # runner tool cache. GitHub Actions cache upload of the Flutter
          # SDK stalled the Analyze post-step for 10+ minutes.
          cache: false
      - name: Build web
        run: bash scripts/ci/run_job.sh build-web

  ios-dev-config-check:
    name: iOS dev config (static)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      # macOS system python3 is 3.9; Homebrew 3.12 is on this runner.
      # The self-test is also 3.9-safe (Optional[int], not int | None).
      - name: Prefer Homebrew Python
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: Static guards (iOS dev config, Maestro, Patrol, holds, CI tooling)
        run: bash scripts/ci/run_job.sh ios-guards

  android-dev-config-check:
    name: Android dev config (static)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"
      - name: Static checks (dev flavor, google-services, docs)
        run: bash scripts/ci/run_job.sh android-guards

  functions:
    name: Functions lint & test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Functions lint, unit tests, staff e2e
        run: bash scripts/ci/run_job.sh functions

  rules:
    name: Firestore rules & delegate login e2e (emulators)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Rules + emulator e2e (every test:rules* in package.json)
        run: bash scripts/ci/run_job.sh rules
