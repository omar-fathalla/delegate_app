name: PR User Test builds

# PR head SHA: review builds + downloadable artifacts (no secrets, no Play/App Store upload).
#
# Android artifact naming (read before User Test):
# - Build: `flutter build apk --release --flavor prod` (prod applicationId, release optimizations).
# - CI has no `android/key.properties` → `build.gradle.kts` falls back to **debug** `signingConfig` for release.
# - Output is **APK Signing Scheme v2** with the **debug/upload debug keystore**, NOT an unsigned APK and NOT a store release cert.
# - Artifact prefix: `android-prod-flavor-release-debugsigned-<PR_HEAD_SHA>`.
#
# iOS artifact:
# - `flutter build ios --release --no-codesign --flavor prod` → unsigned `Runner.app` (iphoneos tree).
# - Artifact prefix: `ios-prod-flavor-release-nocodesign-<PR_HEAD_SHA>`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]

permissions:
  contents: read

# One group per workflow per PR (TAS-172): a new push to a PR cancels that PR's
# older User Test build. Separate from CI's group (ci-…), so CI and User Test
# never cancel each other. Heavy Mac builds still run one at a time: they
# only run on the slot-3 runner. See ci.yml.
concurrency:
  group: user-test-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Listener inherited fathalla's PATH (unreadable Android platform-tools).
# Set a clean base PATH so checkout/git do not EACCES that directory.
env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  signing-surface-guard:
    name: Signing & entitlements (no drift)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64, delegate-app]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - name: Entitlements unchanged vs base branch
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --exit-code "$BASE" "$HEAD" -- \
            ios/Runner/Runner.entitlements \
            ios/Runner/Runner-dev.entitlements \
            ios/Flutter/Env-prod.xcconfig \
            ios/Flutter/Env-dev.xcconfig

  android-prod-release:
    name: Android prod flavor (release, debug-signed CI)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # One heavy delegate_app build at a time on the Mac (TAS-172): heavy builds
    # run only on the runner labelled slot-3, so they wait in GitHub's normal
    # job queue one behind the other. The old repo-wide concurrency group
    # (delegate-mac-heavy-build) kept only ONE pending job, so each new PR
    # cancelled the previous PR's waiting build.
    runs-on: [self-hosted, macOS, ARM64, delegate-app, slot-3]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      # Hosted ubuntu fills during assembleProdRelease (ENOSPC at packageProdRelease).
      # Keep NDK 28.2.13676358 (AGP needs it); drop other preinstalled NDKs/system-images.
      # Dropped setup-gradle@v4: PR runs were cache-read-only + cache miss, so it only
      # initialized empty ~/.gradle and burned disk; last green Android jobs had no setup-gradle.
      - name: Free disk on hosted ubuntu
        if: runner.os == 'Linux'
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/system-images || true
          if [ -d /usr/local/lib/android/sdk/ndk ]; then
            for d in /usr/local/lib/android/sdk/ndk/*; do
              [ -e "$d" ] || continue
              case "$(basename "$d")" in
                28.2.13676358) echo "Keeping NDK $d" ;;
                *) echo "Removing NDK $d"; sudo rm -rf "$d" ;;
              esac
            done
          fi
          sudo docker system prune -af || true
          echo "After cleanup:" && df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      # delegate-ci has no Android SDK, and must not use another user's
      # /Users/fathalla/Library/Android/sdk (permission denied).
      # v3 defaults include the obsolete `tools` package, which sdkmanager
      # 16.x no longer ships (exit 1 after licenses were accepted).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK locally.
          # Uploading it to the GitHub Actions cache stalls the post-step.
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Materialize Gradle wrapper
        run: bash scripts/ci_materialize_gradle_wrapper.sh
      - name: Warm Gradle distribution
        working-directory: android
        run: bash ../scripts/ci_gradlew_version_warm.sh
      - name: Build APK (prod flavor release; debug cert without key.properties)
        run: bash scripts/ci_gradle_flutter_apk.sh -- --release --flavor prod --dart-define=ENV=prod
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-prod-flavor-release-debugsigned-${{ env.PR_HEAD_SHA }}
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error
          retention-days: 7

  ios-prod-release:
    name: iOS prod flavor (release, no codesign)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # One heavy delegate_app build at a time on the Mac (TAS-172): heavy builds
    # run only on the runner labelled slot-3, so they wait in GitHub's normal
    # job queue one behind the other. The old repo-wide concurrency group
    # (delegate-mac-heavy-build) kept only ONE pending job, so each new PR
    # cancelled the previous PR's waiting build.
    runs-on: [self-hosted, macOS, ARM64, delegate-app, slot-3]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Sanitize PATH for delegate-ci
        # Listener was started with fathalla's PATH, which includes
        # /Users/fathalla/Library/Android/sdk/platform-tools (EACCES for this user).
        run: |
          CLEAN="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          echo "PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          # Self-hosted tashil-delegate-mac already has the SDK locally.
          # Uploading it to the GitHub Actions cache stalls the post-step.
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Xcode probe (delegate-ci, no sudo)
        run: |
          echo "USER=$(id -un) HOME=$HOME"
          xcodebuild -version
          set +e
          xcodebuild -checkFirstLaunchStatus
          echo "checkFirstLaunchStatus=$?"
          xcodebuild -license check
          echo "license_check=$?"
          set -e
          ls -ld "$HOME/Library/Developer/Xcode/DerivedData" || echo "no DerivedData yet"
      - name: CocoaPods
        run: |
          cd ios
          pod install
      - name: Build iOS prod (device tree, no codesign)
        run: |
          # Do not change signing. Flutter 3.44 may auto-add plugin SPM even
          # when google_maps_flutter_ios / printing do not support it, which on
          # Xcode 27.2 has failed this job in 7.5s with exit 255.
          flutter config --no-enable-swift-package-manager || true
          mkdir -p "$RUNNER_TEMP/DerivedData"
          # flutter-action's cached engine on this runner has empty
          # Flutter.framework dirs (nlink=2, mode 700, no Flutter.h). That
          # made xcodebuild report Flutter.h not found / earlier exit 255.
          # Repair as delegate-ci, no sudo; do not touch other users' SDKs.
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          FW="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework/Headers/Flutter.h"
          if [ ! -f "$FW" ]; then
            echo "Empty/missing Flutter.framework headers; re-precache iOS engine"
            rm -rf               "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios"               "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-profile"               "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release"
            flutter precache --ios
            if [ ! -f "$FW" ]; then
              echo "flutter precache --ios did not restore $FW"
              ls -la "$(dirname "$(dirname "$FW")")" || true
              exit 1
            fi
          fi
          if flutter build ios --release --no-codesign --flavor prod --dart-define=ENV=prod; then
            exit 0
          fi
          echo "----- flutter/ios build failed; collecting logs -----"
          find "$HOME/Library/Developer/Xcode/DerivedData" "$RUNNER_TEMP" "$GITHUB_WORKSPACE/build"             -name 'build-state.json' -o -name '*.xcresult' -o -name 'flutter_*.log'             2>/dev/null | head -50
          # Print last xcodebuild diagnostics if present (no secrets expected).
          find /var/folders -name 'flutter_ios_build_temp_dir*' -type d 2>/dev/null | head
          exit 1
      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-prod-flavor-release-nocodesign-${{ env.PR_HEAD_SHA }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
