name: PR User Test builds

# Unsigned prod release builds + artifacts on the PR head SHA for User Test (no secrets, no deploy).
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: pr-user-test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signing-surface-guard:
    name: Signing & entitlements (no drift)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Entitlements unchanged vs base branch
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --exit-code "$BASE" HEAD -- \
            ios/Runner/Runner.entitlements \
            ios/Runner/Runner-dev.entitlements \
            ios/Flutter/Env-prod.xcconfig \
            ios/Flutter/Env-dev.xcconfig

  android-prod-release:
    name: Android prod release (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (prod, unsigned without key.properties)
        run: flutter build apk --release --flavor prod
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-prod-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-prod-release:
    name: iOS prod release (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: CocoaPods
        run: |
          cd ios
          pod install
      - name: Build iOS prod (simulator, no codesign)
        run: flutter build ios --simulator --release --no-codesign --flavor prod
      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-prod-release-sim-${{ github.sha }}
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 14
