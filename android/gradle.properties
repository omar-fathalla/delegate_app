org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
# AGP 9 migration opt-outs (Flutter 3.44+). Project stays on AGP 8.x in
# settings.gradle.kts until a dedicated migrate-to-AGP-9 pass; these flags
# silence the AGP 9 new-DSL / built-in-Kotlin warnings during Gradle sync.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-agp-9
android.builtInKotlin=false
android.newDsl=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
android.r8.optimizedResourceShrinking=true
android.enableR8.fullMode=true
