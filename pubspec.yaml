  firebase_storage: ^13.6.1
  shared_preferences: ^2.5.4
  go_router: ^18.1.4
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  url_launcher: ^6.3.2
  cached_network_image: ^4.0.7
  device_info_plus: ^12.3.0
  battery_plus: ^6.2.1
  google_maps_flutter: ^2.19.0
  google_maps_flutter_web: ^0.6.1
  uuid: ^4.5.2
  geocoding: ^4.0.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  gal: ^2.3.0
  connectivity_plus: ^7.0.0
  dynamic_color: ^2.1.0
  firebase_crashlytics: ^5.4.1
  package_info_plus: ^9.0.0
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^19.0.0
  # Direct pin: Live Tracking Cairo day math (tzdb 2025b in 0.10.1).
