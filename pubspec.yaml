  webview_flutter: ^4.13.1
  in_app_review: ^2.0.12
  sqflite: ^2.3.0
  path: ^1.9.1
  workmanager: ^0.10.7
  loading_animation_widget: ^1.3.0
  flutter_cache_manager: ^3.4.2
  pdf: ^3.12.0
  printing: ^5.14.3
  animations: ^3.0.0
  material_symbols_icons: ^4.2960.0
