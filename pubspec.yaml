  cloud_firestore: ^6.10.2
  cloud_functions: ^6.2.0
  firebase_auth: ^6.7.1
  firebase_remote_config: ^6.7.1
  smart_auth: ^3.2.0
  pinput: ^7.0.0
  geolocator: ^14.0.2
  intl: ^0.20.2
  google_fonts: ^9.0.0
  bloc: ^9.2.0
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  # TAS-302: JPEG decode/encode for the date+branch stamp on field photos.
